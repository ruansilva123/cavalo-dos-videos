<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./css/styles.css">

</head>

<body>
    <header>
        <h1>Pato Oráculo</h1>
    </header>
    <section class="tela">
        <div class="container">
            <div class="container" id="patinhos-container">
                <!-- Contêiner principal que agrupa os cards dos patinhos -->
                <img src="pato_oraculo.png">
            </div>
            <label for="pergunta">Qual a sua duvida jovem mancebo?</label>
            <div>
                <input id="phrase">
                <button id="btn-pergunta" onclick="getPhrase()">Perguntar</button>
            </div>
        </div>
        <div class="resposta hide" id="answer">Resposta</div>
    </section>
    <script>
        function showAnswer() {
            const divAnswer = document.getElementById("answer");

            selectedPhrase = getPhrase();

            divAnswer.innerHTML = selectedPhrase;

            divAnswer.classList.remove("hide");
        }

        function hideAnswer() {
            const divAnswer = document.getElementById("answer");

            divAnswer.classList.add("hide");
        }

        async function getPhrase() {
            let phrase = document.getElementById("phrase").value;
            console.log(phrase);
            let selectedPhrase = "";

            const url = "http://localhost:3000/resposta";
            try {
                const response = await fetch(url);
                if (!response.ok) {
                    throw new Error(`Response status: ${response.status}`);
                }

                const result = await response.json();
                console.log(result);
            } catch (error) {
                console.error(error.message);
            }

            return selectedPhrase;
        }
    </script>
</body>

</html>
